# Automated update proposals only. CI and Codex review are required before merge.
version: 2
updates:
- package-ecosystem: gitsubmodule
  directory: /
  schedule:
    interval: weekly
    time: "06:00"
    timezone: Europe/Berlin
    day: monday
  open-pull-requests-limit: 5
